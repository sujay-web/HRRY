<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — ShopSphere</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app-header"></div>
<main class="container page">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p>Sign in to your ShopSphere account</p>
    <form id="login-form">
      <div class="field"><label>Email</label><input type="email" id="email" required></div>
      <div class="field"><label>Password</label><input type="password" id="password" required></div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
    <p class="switch">New here? <a href="#" id="show-register">Create an account</a></p>
    <form id="register-form" class="hidden">
      <div class="field"><label>Name</label><input type="text" id="reg-name" required></div>
      <div class="field"><label>Email</label><input type="email" id="reg-email" required></div>
      <div class="field"><label>Password</label><input type="password" id="reg-password" required></div>
      <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>
  </div>
</main>
<div id="app-footer"></div>
<div id="toast-root" class="toast-root"></div>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/login.js"></script>
</body>
</html>
